<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>FORM</title>
        <link rel="stylesheet" href="./css/reset.css" />
        <link rel="stylesheet" href="./css/styles.css" />
    </head>
    <body class="form-page">
        <div class="form-wrapper">
            <h1>Register</h1>
            <form action="" class="form" autocomplete="off">
                <div class="form-group">
                    <div class="avatar-group">
                        <label for="profile-picture" class="form-avatar">
                            <img
                                width="200px"
                                src="https://cdn.pixabay.com/photo/2016/08/08/09/17/avatar-1577909_960_720.png"
                                alt=""
                                class="avatar-img"
                            />
                        </label>
                        <label for="profile-picture" class="form-label">
                            Profile Picture
                        </label>
                        <input
                            type="file"
                            id="profile-picture"
                            name="profile-picture"
                            accept="image/*"
                            hidden
                        />
                    </div>
                </div>
                <div class="form-group">
                    <label for="display-name" class="form-label">
                        Display Name
                    </label>
                    <input
                        class="form-input"
                        type="text"
                        id="display-name"
                        name="display-name"
                        placeholder="Display Name..."
                        spellcheck="false"
                        required
                    />
                </div>
                <div class="form-group">
                    <label for="email" class="form-label"> Email </label>
                    <input
                        class="form-input"
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Email..."
                        spellcheck="false"
                        required
                    />
                </div>
                <div class="form-group">
                    <label for="phone-number" class="form-label">
                        Phone Number
                    </label>
                    <input
                        class="form-input"
                        type="tel"
                        id="phone-number"
                        name="phone-number"
                        placeholder="Phone Number..."
                        spellcheck="false"
                    />
                </div>
                <div class="form-group">
                    <label for="password" class="form-label"> Password </label>
                    <input
                        class="form-input"
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Password..."
                        required
                    />
                </div>
                <div class="form-group">
                    <label for="confirm-password" class="form-label">
                        Confirm Password
                    </label>
                    <input
                        class="form-input"
                        type="password"
                        id="confirm-password"
                        name="confirm-password"
                        placeholder="Confirm Password..."
                        required
                    />
                </div>
                <div class="form-group">
                    <label class="form-label"> Gender </label>
                    <label>
                        <input type="radio" name="gender" id="male" checked />
                        Male
                    </label>
                    <label>
                        <input type="radio" name="gender" id="female" />
                        Female
                    </label>
                    <label>
                        <input type="radio" name="gender" id="other" />
                        Other
                    </label>
                </div>
                <div class="form-group">
                    <label for="date-of-birth" class="form-label">
                        Date of Birth
                    </label>
                    <input
                        class="form-input"
                        type="date"
                        id="date-of-birth"
                        name="date-of-birth"
                    />
                </div>
                <div class="form-group">
                    <label for="address" class="form-label"> Address </label>
                    <input
                        class="form-input"
                        type="text"
                        id="address"
                        name="address"
                        placeholder="Address..."
                        spellcheck="false"
                    />
                </div>
                <div class="form-group">
                    <label class="form-label">Communication Preferences</label>
                    <div class="form-vertical">
                        <label for="subscribe-to-newsletter">
                            <input
                                type="checkbox"
                                id="subscribe-to-newsletter"
                                name="subscribe-to-newsletter"
                            />
                            Subscribe to Newsletter
                        </label>
                        <label for="receive-promotionale-mails">
                            <input
                                type="checkbox"
                                id="receive-promotionale-mails"
                                name="receive-promotionale-mails"
                            />
                            Receive Promotional Emails
                        </label>
                        <label for="get-product-updates">
                            <input
                                type="checkbox"
                                id="get-product-updates"
                                name="get-product-updates"
                            />
                            Get Product Updates
                        </label>
                    </div>
                </div>
                <div class="form-group form-footer">
                    <button class="btn">Register</button>
                </div>
            </form>
        </div>
    </body>
</html>
